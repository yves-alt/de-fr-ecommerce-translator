<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .cat-wrap { border: 1px solid #E8ECF2; border-radius: 10px; overflow: hidden; background: #fff; }
  .cat-head { display: grid; grid-template-columns: 6% 41% 12% 41%;
              position: sticky; top: 0; z-index: 2; background: #F8FAFC;
              border-bottom: 1px solid #E8ECF2; font-size: 11px; font-weight: 700;
              text-transform: uppercase; letter-spacing: 0.04em; color: #6B7A99; }
  .cat-head > div { padding: 8px 10px; }
  /* Fixed px, not vh: this stylesheet lives inside the component's own
     iframe, and setFrameHeight() below measures document.documentElement.
     scrollHeight to size that same iframe from the outside. A vh value
     here is relative to the iframe's current height — exactly the value
     we're trying to compute — so it never grows past whatever the iframe
     happened to start at (one row). A fixed max-height breaks that
     circular dependency: content can grow up to this many px regardless
     of the iframe's current size, and setFrameHeight() then reports the
     real total. */
  .cat-body { max-height: 600px; overflow-y: auto; overflow-x: hidden; }
  .cat-row { display: grid; grid-template-columns: 6% 41% 12% 41%;
             border-bottom: 1px solid #F0F3F8; min-height: 34px; }
  .cat-row.alt { background: #FAFBFD; }
  .cat-row.selected { background: rgba(200,16,46,0.06); box-shadow: inset 3px 0 0 #C8102E; }
  .cat-col { padding: 5px 10px; font-size: 13px; color: #1A2035; display: flex; align-items: center; }
  .cat-col-num { color: #9BA8BE; font-size: 12px; justify-content: center; }
  .cat-col-src { white-space: pre-wrap; word-break: break-word; color: #4A566D; line-height: 1.4; }
  .cat-col-status { border-radius: 5px; margin: 4px; padding: 2px 6px; font-size: 11px;
                     font-weight: 600; justify-content: space-between; cursor: default; }
  .cat-status-icon { margin-right: 3px; }
  .cat-status-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-confirm-btn { cursor: pointer; margin-left: 4px; padding: 0 4px; border-radius: 3px; opacity: 0.55; }
  .cat-confirm-btn:hover { opacity: 1; background: rgba(255,255,255,0.6); }
  .cat-col-tgt { padding: 3px 8px; }
  textarea.cat-target { width: 100%; resize: none; border: 1px solid transparent; border-radius: 5px;
                         padding: 4px 7px; font: inherit; font-size: 13px; line-height: 1.4;
                         color: #1A2035; background: transparent; font-family: inherit; }
  textarea.cat-target:focus { outline: none; border-color: #C8102E; background: #fff;
                               box-shadow: 0 0 0 3px rgba(200,16,46,0.10); }
</style>
</head>
<body>
<div class="cat-wrap">
  <div class="cat-grid">
    <div class="cat-head">
      <div>#</div><div>German source</div><div>Status</div><div>French translation</div>
    </div>
    <div class="cat-body" id="cat-body"></div>
  </div>
</div>
<script>
/* Minimal hand-rolled Streamlit Components protocol (no external JS lib —
   see app.py's confirm_segment/render_cat_review_grid docstrings for why:
   a JS-only bridge onto a hidden st.text_input can update the DOM/React
   value but can't make Streamlit commit+rerun without a genuinely trusted
   browser input event, which page JS cannot synthesize. This is the real
   protocol Streamlit's own frontend listens for, so no such trust issue. */
function sendToStreamlit(type, extra) {
  window.parent.postMessage(Object.assign({ type: type, isStreamlitMessage: true }, extra), "*");
}
function setComponentValue(value) {
  sendToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
}
function setFrameHeight() {
  var h = document.documentElement.scrollHeight;
  sendToStreamlit("streamlit:setFrameHeight", { height: h });
}

var currentArgs = null;

function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 110) + 'px'; }
function focusRow(ta) {
  ta.focus(); ta.select();
  ta.scrollIntoView({ block: 'center' });
  document.querySelectorAll('.cat-row.selected').forEach(function(r) { r.classList.remove('selected'); });
  var row = ta.closest('.cat-row');
  if (row) row.classList.add('selected');
}
function confirmRow(id) {
  var ta = document.querySelector('textarea.cat-target[data-id="' + CSS.escape(id) + '"]');
  if (!ta) return;
  setComponentValue({ id: id, text: ta.value, nonce: Date.now() + '-' + Math.random() });
}
function moveFocus(fromEl, dir) {
  var all = Array.prototype.slice.call(document.querySelectorAll('textarea.cat-target'));
  var idx = all.indexOf(fromEl);
  if (idx === -1) return;
  for (var step = idx + dir; step >= 0 && step < all.length; step += dir) {
    if (all[step].dataset.unresolved === '1') { focusRow(all[step]); return; }
  }
  var fallback = all[idx + dir];
  if (fallback) focusRow(fallback);
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function render(args) {
  currentArgs = args;
  var rows = args.rows || [];
  var activeId = args.active_id || null;
  var body = document.getElementById("cat-body");
  var html = "";
  rows.forEach(function (r, i) {
    html += '<div class="cat-row ' + (i % 2 ? "alt" : "") + ' ' + (r.id === activeId ? "selected" : "") + '"' +
      ' data-id="' + escapeHtml(r.id) + '" data-unresolved="' + (r.unresolved ? 1 : 0) + '">' +
      '<div class="cat-col cat-col-num">' + escapeHtml(r.row) + '</div>' +
      '<div class="cat-col cat-col-src">' + escapeHtml(r.source) + '</div>' +
      '<div class="cat-col cat-col-status" title="' + escapeHtml(r.title) + '" style="' + r.style + '">' +
      '<span class="cat-status-icon">' + escapeHtml(r.icon) + '</span>' +
      '<span class="cat-status-label">' + escapeHtml(r.code) + '</span>' +
      '<span class="cat-confirm-btn" data-confirm-id="' + escapeHtml(r.id) + '" title="Confirm (Ctrl+Enter)">✓</span>' +
      '</div>' +
      '<div class="cat-col cat-col-tgt">' +
      '<textarea class="cat-target" data-id="' + escapeHtml(r.id) + '" data-unresolved="' + (r.unresolved ? 1 : 0) + '" rows="1">' +
      escapeHtml(r.target) + '</textarea>' +
      '</div></div>';
  });
  body.innerHTML = html;

  document.querySelectorAll("textarea.cat-target").forEach(function (ta) {
    autoGrow(ta);
    ta.addEventListener("input", function () { autoGrow(ta); });
    ta.addEventListener("focus", function () { focusRow(ta); });
  });

  if (activeId) {
    var el = document.querySelector('textarea.cat-target[data-id="' + CSS.escape(activeId) + '"]');
    if (el) focusRow(el);
  }
  setFrameHeight();
}

document.addEventListener("keydown", function (e) {
  var ta = e.target;
  if (ta.tagName !== "TEXTAREA" || !ta.classList.contains("cat-target")) return;
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    confirmRow(ta.dataset.id);
  } else if (e.ctrlKey && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    moveFocus(ta, e.key === "ArrowDown" ? 1 : -1);
  }
});
document.addEventListener("click", function (e) {
  var btn = e.target.closest(".cat-confirm-btn");
  if (btn) confirmRow(btn.dataset.confirmId);
});

window.addEventListener("message", function (event) {
  var data = event.data;
  if (!data || data.type !== "streamlit:render") return;
  render(data.args || {});
});

sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
setFrameHeight();
</script>
</body>
</html>
